name: CI Validation Matrix (Antigravity Customizations)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-framework:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Execute Full Audit Suite
        run: |
          python ./scripts/agy_cli.py audit

      - name: Run Test Matrix (SK-01 to SK-07)
        run: |
          python ./scripts/run_matrix_checks.py

      - name: Run E2E Test Suite
        run: |
          python -m unittest discover ./tests

      - name: Generate Telemetry Dashboard
        run: |
          python ./scripts/agy_cli.py dashboard
